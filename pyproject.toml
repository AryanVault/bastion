[project]
name = "bastion"
version = "0.1.0"
description = "A secure, always-on personal AI agent. The system, not the model, decides what the agent may do."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.15",
]

[project.scripts]
bastion = "bastion.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PTH",           # use pathlib
    "T20",           # no print()
    "ASYNC",         # async pitfalls
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are fine in tests

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["bastion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "security: tests that assert a security control holds against an attack",
    "live: tests that call real external services (skipped by default)",
]

[tool.coverage.run]
source = ["bastion"]
branch = true
omit = ["*/bastion/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.bandit]
exclude_dirs = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
