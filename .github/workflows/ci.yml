name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only get read access unless they ask for more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Third-party actions are pinned to full commit SHAs, not mutable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: Tests with coverage gate
        run: uv run pytest --cov --cov-report=term-missing

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install (locked)
        run: uv sync --locked
      - name: Bandit (static security analysis)
        run: uv run bandit -c pyproject.toml -r src
      # Every attack in the corpus, with a model that obeys the attacker: fails if any succeeds.
      - name: Red-team suite
        run: uv run bastion redteam
      # Audit exactly what uv.lock pins (hash-checked, nothing installed), not the environment.
      - name: pip-audit (known-vulnerable dependencies in the lockfile)
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o requirements-audit.txt
          uv run pip-audit --strict --disable-pip --require-hashes -r requirements-audit.txt

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pinned binary verified against a hardcoded SHA-256: no third-party action involved.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan the full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --tag bastion:ci .
      - name: Runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id bastion:ci -u)" = "10001"
      # The same flags as compose.yaml: read-only root, no capabilities, no privilege gain.
      - name: Red-team suite inside the hardened container
        run: >-
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL
          --security-opt no-new-privileges:true bastion:ci redteam
      - name: Set up and check the sealed secret store
        run: |
          head -c 32 /dev/urandom | base64 > master.key
          chmod 0444 master.key  # CI only: lets the container's user read the mounted key
          docker volume create bastion-ci
          hardened=(--rm --read-only --tmpfs /tmp --cap-drop ALL
            --security-opt no-new-privileges:true -v bastion-ci:/data
            -v "$PWD/master.key:/run/secrets/bastion_master_key:ro")
          echo | docker run -i "${hardened[@]}" bastion:ci init --provider ollama --model llama3
          docker run "${hardened[@]}" bastion:ci secrets status | tee status.txt
          grep -q "encrypted file" status.txt
          grep -q "audit.hmac_key.*set" status.txt
          docker run "${hardened[@]}" bastion:ci audit verify
